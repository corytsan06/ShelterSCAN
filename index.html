<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelterSCAN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="createShelterList.js"></script>
    
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="video-container">
        <video autoplay muted loop>
          <source src="uci_pan.mp4" type="video/mp4">
        </video>
    </div>

    <div id="overlay">
        <div id="center_ui">
            <h1 id="brand-title">ShelterSCAN</h1>
            <p id="typedText"></p>
            <form id="shelter-search-form" class="input-container">
                <input type="text" id="userAddress" placeholder="Enter origin" autocomplete="street-address" required>
                <button type="submit" id="sendBtn" aria-label="Search for nearby shelters">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i>
                </button>
            </form>
            <p id="search-status" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script src="typing.js"></script>
    <script src="orangeHeavenSeeker.js"></script>
    <script src="maps-config.js"></script>
</body>
</html>
